name: test
on: [push, pull_request]
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements-audit.txt -r requirements-app.txt
      - run: PYTHONPATH=scripts python -m unittest discover -s scripts -p 'test_*.py'
